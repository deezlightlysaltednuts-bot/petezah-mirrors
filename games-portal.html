    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 11px;
      color: #fbbf24;
      font-weight: 600;
    }

    /* SEARCH & FILTER */
    .search-box {
      flex: 1;
      max-width: 460px;
      min-width: 240px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 10px 18px 10px 40px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #f59e0b;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 14px;
    }

    /* AD BANNER SECTION */
    .ad-banner-container {
      width: 100%;
      max-width: 980px;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ad-wrapper {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* CATEGORIES BAR */
    .categories {
      display: flex;
      gap: 8px;
      padding: 16px 24px 0;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #9ca3af;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cat-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.35);
    }

    /* MAIN CONTAINER & GRID */
    main {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-count {
      font-size: 12px;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #020617;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .game-card:hover .thumb-img {
      transform: scale(1.05);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .game-card:hover .play-overlay {
      opacity: 1;
    }

    .play-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }

    .card-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .game-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* EMBED MODAL POPUP */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #modal.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      background: #0b0f19;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(245, 158, 11, 0.15);
    }

    .modal-header {
      padding: 12px 18px;
      background: #070a12;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .modal-btn.close {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .modal-btn.close:hover {
      background: rgba(239, 68, 68, 0.35);
    }

    .player-iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #000;
    }

    /* FOOTER */
    footer {
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: auto;
    }

    footer a {
      color: #fbbf24;
      text-decoration: none;
    }
  </style>
</head>

    let allGames = PETEZAH_GAMES;
    let currentCategory = 'All';
    let searchQuery = '';
    let activeGame = null;

    function loadGames() {
      renderGames();
    }

    function renderGames() {
      const grid = document.getElementById('game-grid');
      const filtered = allGames.filter(g => {
        const matchesCat = currentCategory === 'All' || (g.categories && g.categories.includes(currentCategory));
        const matchesQuery = !searchQuery || g.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      document.getElementById('game-counter').textContent = filtered.length + ' Games';

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #9ca3af;">No games found matching your search.</div>';
        return;
      }

      grid.innerHTML = filtered.map(game => `
        <div class="game-card" onclick="openGame('${game.id}', '${game.title}')">
          <div class="thumb-wrap">
            <img class="thumb-img" src="${game.thumbnail}" alt="${game.title}" onerror="this.src='logo.png'">
            <div class="play-overlay">
              <span class="play-badge">▶ PLAY NOW</span>
            </div>
          </div>
          <div class="card-info">
            <div class="game-title">${game.title}</div>
            <div class="tags">
              ${(game.categories || ['Games']).map(cat => `<span class="tag">${cat}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat) || (cat === 'All' && btn.textContent.includes('All')));
      });
      renderGames();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim();
      renderGames();
    }

    function openGame(gameId, title) {
      activeGame = { id: gameId, title };
      const modal = document.getElementById('modal');
      const iframe = document.getElementById('modal-iframe');
      document.getElementById('modal-game-title').textContent = title;
      
      iframe.src = 'embed.html?game=' + encodeURIComponent(gameId);
      modal.classList.add('open');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      const iframe = document.getElementById('modal-iframe');
      modal.classList.remove('open');
      iframe.src = '';
      activeGame = null;
    }

    function copyEmbedCode() {
      if (!activeGame) return;
      const embedUrl = 'embed.html?game=' + encodeURIComponent(activeGame.id);
      const snippet = '<iframe src="' + embedUrl + '" width="100%" height="640" frameborder="0" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>';
      navigator.clipboard.writeText(snippet);
      alert('PeteZah Embed HTML snippet copied to clipboard!\n\n' + snippet);
    }

    function toggleModalFullscreen() {
      const modalContent = document.querySelector('.modal-content');
      if (!document.fullscreenElement) {
        modalContent.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Initialize
    loadGames();
  </script>

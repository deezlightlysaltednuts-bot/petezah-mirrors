<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter-Strike Portable | PeteZah</title>
  <script src="https://cdn.jsdelivr.net/npm/coi-serviceworker/coi-serviceworker.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    window.EJS_player = "#game";
    window.EJS_core = "psp";
    window.EJS_gameUrl = "/api/asset-proxy?url=" + encodeURIComponent("https://bait.hbmc.net/games/psp/cs/cs.iso");
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_threads = true;
    window.EJS_startOnLoaded = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>

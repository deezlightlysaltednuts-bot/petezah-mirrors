<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      touch-action: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;

      background: #000 !important;

      display: block !important;
    }
    #unity-mobile-warning, .unity-mobile-warning {
      display: none !important;
    }
  </style>
  <script>
    // Global iPad AudioContext Unlocker on first tap/touch
    (function() {
      function unlock() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
          }
        } catch(e) {}
      }
      window.addEventListener('touchstart', unlock, { once: true, passive: true });
      window.addEventListener('pointerdown', unlock, { once: true, passive: true });
      window.addEventListener('click', unlock, { once: true, passive: true });
      document.addEventListener('touchmove', function(e) {
        if (e.cancelable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>
 
    <script>
      window.gameconfig = {
        name: "Crash Bandicoot",
        url: "https://cdn.jsdelivr.net/gh/eazy-man/shHH@main/ps1/Crash%20Bandicoot%20(USA).zip",
        core: "psx",
        min: 1,
        max: 29,
      };
    </script>
    <script>
      function mergeFiles(fileParts, cb) {
        return new Promise((resolve, reject) => {
          let buffers = [];
          function fetchPart(index) {
            if (index >= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            fetch(fileParts[index])
              .then((response) => response.arrayBuffer())
              .then((data) => {
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
            cb(index);
          }
          fetchPart(0);
        });
      }
      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          let padded = String(i).padStart((end+"").length, '0');
          parts.push(file + ".part" + padded);
        }
        return parts;
      }
getParts("asd.js", 0, 100)
    </script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading: 0/0</div>
      <div id="first-time">First-time loading may take longer...</div>
    </div>
    <script>
      var parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max
      );
      var totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const progressElement = document.getElementById("loading-progress");
        if (loaded === 0) {
          progressElement.textContent = "Loading: 0/0";
        } else {
          progressElement.textContent = `Loading: ${loaded}/${totalParts}`;
        }
      }

      Promise.all([mergeFiles(parts, updateLoadingProgress)])
        .then(([gameUrl]) => {
          document.getElementById("loading-progress").remove();
          document.getElementById("first-time").remove();
          EJS_player = "#game";
          EJS_core = window.gameconfig.core;
          EJS_gameName = window.gameconfig.name;
          EJS_color = "#0064ff";
          EJS_startOnLoaded = true;
          EJS_pathtodata = "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/so-emo@master/";
          EJS_gameUrl = gameUrl;
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/so-emo@master/loader.js";
          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("loading-progress").textContent =
            "Error loading game.";
        });
    </script>
  </body>
</html>

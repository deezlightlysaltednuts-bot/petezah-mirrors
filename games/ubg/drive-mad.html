<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/poki/Drivemad/">
    <meta charset="utf-8">
    <title>Drive Mad</title>
    <meta name="description" content="Play Drive Mad on the web.">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" href="webapp/fancade.css">
    <link rel="icon" href="webapp/favicon.ico">
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #canvas_border {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas.emscripten {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        border: none;
      }
      #play_content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 20;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(16px);
        padding: 24px 32px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        min-width: 260px;
      }
      .cover {
        width: 120px;
        height: 120px;
        border-radius: 14px;
        object-fit: cover;
        display: block;
        margin: 0 auto 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .title {
        color: #fff;
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 4px;
      }
      .author {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        margin: 0 0 16px;
      }
      #progress {
        width: 100%;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        accent-color: #3b82f6;
      }
    </style>
</head>
<body id="body">
    <div id="modal_parent" style="display:none;">
        <div id="modal_content">
            <span id="modal_close_button">&times;</span>
            <div id="store_link_modal_content" class="modal_inner"></div>
            <div id="share_file_modal_content" class="modal_inner"></div>
        </div>
    </div>
    <div id="canvas_border" class="emscripten_border">
        <div id="play_content">
            <div class="edge">
                <div class="box">
                    <div class="black">
                        <img src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/poki/Drivemad/webapp/cover.jpg" class="cover" alt="Drive Mad" onclick="if(typeof tryStartGame === 'function') { tryStartGame(); }">
                        <p class="title">Drive Mad</p>
                        <p class="author">Fancade</p>
                    </div>
                </div>
            </div>
            <div id="progress_or_play">
                <progress id="progress" class="loading" value="0" max="100"></progress>
            </div>
            <p class="description" style="color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 10px;">Loading game engine...</p>
        </div>
        <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
        <div id="gradient"></div>
        <div id="webview_content"></div>
    </div>
    <script>
        window.pokiDebug = true;
        window.theDomLoaded = true;
        window.pokiInited = true;
        window.PokiSDK = {
            init: function() { return Promise.resolve(); },
            gameLoadingStart: function() {},
            gameLoadingFinished: function() { 
                var loader = document.getElementById('play_content');
                if (loader) loader.style.display = 'none';
                return Promise.resolve(); 
            },
            commercialBreak: function() { return Promise.resolve(); },
            rewardedBreak: function() { return Promise.resolve(false); },
            showLeaderboard: function() {},
            gameplayStart: function() {},
            gameplayStop: function() {},
            happyTime: function() {},
            customEvent: function() {},
            measure: function() {},
            getURLParam: function() { return ''; },
            getLanguage: function() { return 'en'; },
            getIsoLanguage: function() { return undefined; },
            isAdBlocked: function() { return false; },
            getUser: function() { return Promise.resolve({}); },
            getToken: function() { return Promise.resolve(''); },
            login: function() { return Promise.resolve(); },
            destroyAd: function() {},
            displayAd: function() { return Promise.resolve(true); },
            shareableURL: function() { return Promise.reject(); }
        };
    </script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/poki/Drivemad/webapp/source_min.js" crossorigin="anonymous"></script>
    <script>
        if (typeof Module !== 'undefined') {
            Module.locateFile = function(path, prefix) {
                var cleanPath = (path || '').replace(/^webapp\//, '');
                return "https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/poki/Drivemad/webapp/" + cleanPath;
            };
        }
        
        // Ensure domLoaded and pokiInited flags are ready
        window.theDomLoaded = true;
        window.pokiInited = true;
        
        // Ensure tryStartGame keeps retrying until postRunDone is true
        var origTryStart = window.tryStartGame;
        window.tryStartGame = function() {
            window.startGameAttempts = 0; // Prevent giving up after 20 attempts
            if (typeof origTryStart === 'function') {
                origTryStart();
            }
            if (typeof postRunDone !== 'undefined' && postRunDone && typeof startGame === 'function') {
                var loader = document.getElementById('play_content');
                if (loader) loader.style.display = 'none';
            }
        };
    </script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/SnakierdoorCode/GAMES@main/RIPS/poki/Drivemad/webapp/index.js" crossorigin="anonymous"></script>
    <script>
      (function bootDriveMad() {
        var pollCount = 0;
        var iv = setInterval(function() {
          pollCount++;
          if (typeof domContentLoaded === 'function' && !window.theDomLoaded) {
            try { domContentLoaded(); } catch(e) {}
          }
          if (typeof setPokiInited === 'function' && !window.pokiInited) {
            try { setPokiInited(); } catch(e) {}
          }
          if (typeof postRunDone !== 'undefined' && postRunDone) {
            if (typeof startGame === 'function' && (!window.gameStarted)) {
              try { startGame(); } catch(e) {}
            }
            var loader = document.getElementById('play_content');
            if (loader) loader.style.display = 'none';
            clearInterval(iv);
          } else if (typeof tryStartGame === 'function') {
            try { tryStartGame(); } catch(e) {}
          }
          if (pollCount > 120) { // 30s timeout
            clearInterval(iv);
          }
        }, 250);
      })();
    </script>
</body>
</html>

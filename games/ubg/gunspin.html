<html lang="en-us">
  <head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body {
      touch-action: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      overflow: hidden !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000 !important;
    }
    canvas {
      touch-action: none !important;
      display: block !important;
    }
    #unity-mobile-warning, .unity-mobile-warning {
      display: none !important;
    }
  </style>
  <script>
    // Global iPad AudioContext Unlocker on first tap/touch
    (function() {
      function unlock() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
          }
        } catch(e) {}
      }
      window.addEventListener('touchstart', unlock, { once: true, passive: true });
      window.addEventListener('pointerdown', unlock, { once: true, passive: true });
      window.addEventListener('click', unlock, { once: true, passive: true });
      document.addEventListener('touchmove', function(e) {
        if (e.cancelable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
        }
      }, { passive: false });
    })();
  </script>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
                                                                                                                                            
	  window.gameInstance = UnityLoader.instantiate("unityContainer", "Build/GunSpin%20WebGL%20FinalVersion.json");
    </script>
	<style>
		* { 
			margin: 0; padding: 0; 
		} 
		body { 
			background: black; 
		}
		div#unityContainer {
			margin: auto !important;
			position: absolute !important;
			left: 50%;
			top: 50%;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			width: 720px; 
			height: 480px;
			width: 150vh !important;
			height: 100vh !important;
		}
		.footer {
		display:none 
		}
	</style>
  </head>
  <body style="overflow:hidden;">
    <div class="webgl-content">
      <div id="unityContainer"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">GunSpin</div>
      </div>
    </div>
  </body>
</html>

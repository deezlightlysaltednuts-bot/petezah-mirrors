<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hollow Knight: Silksong | PeteZah</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        touch-action: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
        display: block;
        touch-action: none;
      }
      #loading-modal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: rgba(10, 15, 29, 0.94);
        backdrop-filter: blur(20px);
        padding: 28px 36px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
        z-index: 9999;
        min-width: 320px;
        max-width: 90vw;
      }
      .loading-title {
        color: #e0e7ff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .loading-subtitle {
        color: rgba(255, 255, 255, 0.65);
        font-size: 13px;
        margin-bottom: 18px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 5px;
        transition: width 0.15s ease;
      }
      .loading-stats {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        font-variant-numeric: tabular-nums;
      }

      /* iPad / Touch Virtual Gamepad Controls */
      #virtual-controller {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 8000;
        display: none;
      }

      .dpad-zone {
        position: absolute;
        bottom: 24px;
        left: 24px;
        width: 160px;
        height: 160px;
        pointer-events: auto;
        touch-action: none;
      }

      .dpad-btn {
        position: absolute;
        background: rgba(255, 255, 255, 0.15);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        touch-action: none;
        transition: background 0.1s, transform 0.1s;
      }

      .dpad-btn:active, .dpad-btn.active {
        background: rgba(168, 85, 247, 0.55);
        border-color: #a855f7;
        transform: scale(0.95);
      }

      .dpad-up { top: 0; left: 54px; width: 52px; height: 50px; }
      .dpad-down { bottom: 0; left: 54px; width: 52px; height: 50px; }
      .dpad-left { top: 54px; left: 0; width: 50px; height: 52px; }
      .dpad-right { top: 54px; right: 0; width: 50px; height: 52px; }
      .dpad-center { position: absolute; top: 54px; left: 54px; width: 52px; height: 52px; background: rgba(0,0,0,0.3); border-radius: 8px; }

      .action-zone {
        position: absolute;
        bottom: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: auto;
        touch-action: none;
      }

      .action-row {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .act-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        touch-action: none;
        line-height: 1.1;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        transition: background 0.1s, transform 0.1s;
      }

      .act-btn small {
        font-size: 9px;
        opacity: 0.65;
        font-weight: 600;
      }

      .act-btn:active, .act-btn.active {
        transform: scale(0.92);
      }

      .btn-jump { background: rgba(34, 197, 94, 0.35); border-color: #22c55e; }
      .btn-jump:active, .btn-jump.active { background: rgba(34, 197, 94, 0.7); }

      .btn-attack { background: rgba(239, 68, 68, 0.35); border-color: #ef4444; }
      .btn-attack:active, .btn-attack.active { background: rgba(239, 68, 68, 0.7); }

      .btn-dash { background: rgba(168, 85, 247, 0.35); border-color: #a855f7; }
      .btn-dash:active, .btn-dash.active { background: rgba(168, 85, 247, 0.7); }

      .btn-focus { background: rgba(234, 179, 8, 0.35); border-color: #eab308; }
      .btn-focus:active, .btn-focus.active { background: rgba(234, 179, 8, 0.7); }

      .top-touch-bar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }

      .util-btn {
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #cbd5e1;
        font-size: 11px;
        font-weight: 600;
        backdrop-filter: blur(8px);
        touch-action: none;
        cursor: pointer;
      }

      .util-btn:active, .util-btn.active {
        background: rgba(168, 85, 247, 0.4);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="loading-modal">
      <div class="loading-title">Hollow Knight: Silksong</div>
      <div class="loading-subtitle" id="loading-status">Booting Game Engine...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="loading-stats">
        <span id="loading-mb">Preparing Engine (35 MB)...</span>
        <span id="loading-pct">0%</span>
      </div>
    </div>

    <!-- Virtual Gamepad for School iPads & Tablets -->
    <div id="virtual-controller">
      <div class="dpad-zone">
        <button class="dpad-btn dpad-up" data-key="ArrowUp" data-code="ArrowUp" data-keycode="38">▲</button>
        <button class="dpad-btn dpad-left" data-key="ArrowLeft" data-code="ArrowLeft" data-keycode="37">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" data-key="ArrowRight" data-code="ArrowRight" data-keycode="39">▶</button>
        <button class="dpad-btn dpad-down" data-key="ArrowDown" data-code="ArrowDown" data-keycode="40">▼</button>
      </div>

      <div class="action-zone">
        <div class="action-row">
          <button class="act-btn btn-focus" data-key="a" data-code="KeyA" data-keycode="65">BIND<small>A</small></button>
          <button class="act-btn btn-dash" data-key="c" data-code="KeyC" data-keycode="67">DASH<small>C</small></button>
        </div>
        <div class="action-row">
          <button class="act-btn btn-attack" data-key="x" data-code="KeyX" data-keycode="88">NEEDLE<small>X</small></button>
          <button class="act-btn btn-jump" data-key="z" data-code="KeyZ" data-keycode="90">JUMP<small>Z</small></button>
        </div>
      </div>

      <div class="top-touch-bar">
        <button class="util-btn" data-key="Tab" data-code="Tab" data-keycode="9">MAP (Tab)</button>
        <button class="util-btn" data-key="Escape" data-code="Escape" data-keycode="27">PAUSE</button>
        <button id="toggle-ctrl-btn" class="util-btn" onclick="toggleControls()">🎮 Controls: ON</button>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
      // Suppress alert dialogs
      window.alert = function(msg) { console.log("[Silksong alert suppressed]:", msg); };

      const statusEl = document.getElementById("loading-status");
      const fillEl = document.getElementById("progress-fill");
      const mbEl = document.getElementById("loading-mb");
      const pctEl = document.getElementById("loading-pct");
      const modal = document.getElementById("loading-modal");
      const controllerEl = document.getElementById("virtual-controller");

      const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /iPad|iPhone|iPod|Android/i.test(navigator.userAgent);
      if (isTouch && controllerEl) {
        controllerEl.style.display = 'block';
      }

      let controlsVisible = isTouch;
      function toggleControls() {
        controlsVisible = !controlsVisible;
        if (controllerEl) controllerEl.style.display = controlsVisible ? 'block' : 'none';
        const btn = document.getElementById('toggle-ctrl-btn');
        if (btn) btn.textContent = controlsVisible ? '🎮 Controls: ON' : '🎮 Controls: OFF';
      }

      // Virtual Controller Touch Event Dispatcher
      function sendKeyEvent(type, key, code, keyCode) {
        const ev = new KeyboardEvent(type, {
          key: key,
          code: code,
          keyCode: keyCode,
          which: keyCode,
          bubbles: true,
          cancelable: true,
          composed: true,
        });
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
        const cv = document.querySelector("#unity-canvas");
        if (cv) cv.dispatchEvent(ev);
      }

      function bindTouchButton(btn) {
        const key = btn.getAttribute('data-key');
        const code = btn.getAttribute('data-code');
        const keyCode = parseInt(btn.getAttribute('data-keycode') || '0', 10);
        if (!key) return;

        const onStart = (e) => {
          e.preventDefault();
          btn.classList.add('active');
          if (navigator.vibrate) try { navigator.vibrate(10); } catch(err) {}
          sendKeyEvent('keydown', key, code, keyCode);
        };

        const onEnd = (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          sendKeyEvent('keyup', key, code, keyCode);
        };

        btn.addEventListener('touchstart', onStart, { passive: false });
        btn.addEventListener('touchend', onEnd, { passive: false });
        btn.addEventListener('touchcancel', onEnd, { passive: false });
        btn.addEventListener('mousedown', onStart);
        btn.addEventListener('mouseup', onEnd);
        btn.addEventListener('mouseleave', onEnd);
      }

      document.querySelectorAll('#virtual-controller button').forEach(bindTouchButton);

      // iPad Audio Unlock on first interaction
      ['touchstart', 'touchend', 'click'].forEach(evt => {
        window.addEventListener(evt, () => {
          if (window.unityInstance && window.unityInstance.Module && window.unityInstance.Module.audioContext) {
            if (window.unityInstance.Module.audioContext.state === 'suspended') {
              window.unityInstance.Module.audioContext.resume();
            }
          }
        }, { once: true });
      });

      const canvas = document.querySelector("#unity-canvas");
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const config = {
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
        dataUrl: "Build/w-pt.data.unityweb",
        frameworkUrl: "Build/w-pt.framework.js.unityweb",
        codeUrl: "Build/w-pt.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Team Cherry",
        productName: "Hollow Knight Silksong",
        productVersion: "1.0",
      };

      const loaderScript = document.createElement("script");
      loaderScript.src = "Build/w-pt.loader.js";
      loaderScript.onload = () => {
        if (typeof createUnityInstance === "function") {
          createUnityInstance(canvas, config, (progress) => {
            const pct = Math.round(progress * 100);
            if (fillEl) fillEl.style.width = pct + "%";
            if (pctEl) pctEl.textContent = pct + "%";
            if (mbEl) mbEl.textContent = `${(progress * 35.4).toFixed(1)} MB / 35.4 MB`;
            if (statusEl) statusEl.textContent = `Loading Silksong Modules (${pct}%)...`;
          }).then((inst) => {
            window.unityInstance = inst;
            if (modal) modal.style.display = "none";
          }).catch((e) => {
            if (statusEl) statusEl.textContent = "Launch Error: " + (e?.message || e);
          });
        }
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>

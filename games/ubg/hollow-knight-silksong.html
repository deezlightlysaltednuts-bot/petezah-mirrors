<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Hollow Knight: Silksong</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
      }
      #loading-modal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: rgba(10, 15, 29, 0.94);
        backdrop-filter: blur(20px);
        padding: 28px 36px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
        z-index: 50;
        min-width: 320px;
        max-width: 90vw;
      }
      .loading-title {
        color: #e0e7ff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .loading-subtitle {
        color: rgba(255, 255, 255, 0.65);
        font-size: 13px;
        margin-bottom: 18px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 5px;
        transition: width 0.15s ease;
      }
      .loading-stats {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="loading-modal">
      <div class="loading-title">Hollow Knight: Silksong</div>
      <div class="loading-subtitle" id="loading-status">Initializing Game Engine...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="loading-stats">
        <span id="loading-mb">0 MB / 1986 MB</span>
        <span id="loading-pct">0%</span>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar" style="display: none;">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning" style="display: none;"></div>
    </div>

    <!-- Multi-CDN JSZip Loader with Fallbacks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
      if (typeof window.JSZip === 'undefined') {
        document.write('<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"><\/script>');
      }
    </script>
    <script>
      if (typeof window.JSZip === 'undefined') {
        document.write('<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"><\/script>');
      }
    </script>

    <script>
      (function() {
        const CACHE_NAME = "hksilksongcache-v3";
        const statusEl = document.getElementById("loading-status");
        const fillEl = document.getElementById("progress-fill");
        const mbEl = document.getElementById("loading-mb");
        const pctEl = document.getElementById("loading-pct");
        const modal = document.getElementById("loading-modal");

        function updateProgress(loadedBytes, totalBytes, stageText) {
          const pct = Math.min(Math.round((loadedBytes / totalBytes) * 100), 100);
          const mbDone = (loadedBytes / (1024 * 1024)).toFixed(1);
          const mbTotal = (totalBytes / (1024 * 1024)).toFixed(1);
          if (fillEl) fillEl.style.width = pct + "%";
          if (pctEl) pctEl.textContent = pct + "%";
          if (mbEl) mbEl.textContent = mbDone + " MB / " + mbTotal + " MB";
          if (statusEl && stageText) statusEl.textContent = stageText;
        }

        async function ensureJSZipLoaded() {
          if (typeof window.JSZip !== 'undefined') return window.JSZip;
          const fallbacks = [
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
            "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
            "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js",
            "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/jszip.js"
          ];
          for (const url of fallbacks) {
            try {
              await new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = url;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
              if (typeof window.JSZip !== 'undefined') return window.JSZip;
            } catch (e) {}
          }
          throw new Error("Unable to load JSZip decompression library. Check internet connectivity.");
        }

        const originalFetch = window.fetch;
        window.fetch = async function(resource, options) {
          let url = typeof resource === "string" ? resource : (resource ? resource.url : "");
          let cleanPath = url.split("?")[0].split("/").pop();
          try {
            const cache = await caches.open(CACHE_NAME);
            let cached = await cache.match(url);
            if (!cached && cleanPath) cached = await cache.match(cleanPath);
            if (cached) return cached;
          } catch(e) {}
          
          if (typeof resource === "string" && !resource.startsWith("http") && !resource.startsWith("blob:") && !resource.startsWith("data:")) {
            resource = CDN_BASES[0] + resource.replace(/^(\.\/|\/)/, '');
          }
          return originalFetch(resource, options);
        };

        async function isCached() {
          try {
            const cache = await caches.open(CACHE_NAME);
            const done = await cache.match("CACHE_COMPLETE");
            return !!done;
          } catch(e) {
            return false;
          }
        }

        async function cleanupOldCaches() {
          try {
            const cacheNames = await caches.keys();
            await Promise.all(
              cacheNames.map(name => {
                if (name !== CACHE_NAME && name.includes("hksilksong")) {
                  return caches.delete(name);
                }
              })
            );
          } catch(e) {}
        }

        const CDN_BASES = [
          "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
          "https://fastly.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
          "https://gcore.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
          "https://testingcf.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
          "https://raw.githubusercontent.com/web-ports/hollow-knight-silksong/master/"
        ];

        async function fetchPartWithRetry(partPath, partIndex, onBytes) {
          const primaryBase = CDN_BASES[partIndex % 4];
          const candidates = [
            primaryBase + partPath,
            CDN_BASES[(partIndex + 1) % 4] + partPath,
            CDN_BASES[(partIndex + 2) % 4] + partPath,
            "/api/asset-proxy?url=" + encodeURIComponent(primaryBase + partPath),
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(primaryBase + partPath)
          ];

          for (const target of candidates) {
            try {
              const res = await originalFetch(target);
              if (!res.ok) throw new Error("HTTP " + res.status);
              const ab = await res.arrayBuffer();
              if (ab.byteLength < 100) throw new Error("Incomplete part download");
              onBytes(ab.byteLength);
              return ab;
            } catch(e) {}
          }
          throw new Error("Failed to download " + partPath);
        }

        async function downloadPartsConcurrently(parts, totalExpectedBytes, concurrency = 24) {
          let loadedBytes = 0;
          const results = new Array(parts.length);
          let nextIndex = 0;

          function onBytes(n) {
            loadedBytes += n;
            updateProgress(loadedBytes, totalExpectedBytes, "Ultra-Speed Downloading (" + Math.round((loadedBytes / totalExpectedBytes) * 100) + "%)...");
          }

          async function worker() {
            while (nextIndex < parts.length) {
              const idx = nextIndex++;
              results[idx] = await fetchPartWithRetry(parts[idx], idx, onBytes);
            }
          }

          const workers = [];
          for (let i = 0; i < Math.min(concurrency, parts.length); i++) {
            workers.push(worker());
          }
          await Promise.all(workers);
          return new Blob(results, { type: "application/zip" });
        }

        async function unzipAndStore(zipBlob) {
          if (statusEl) statusEl.textContent = "High-speed extracting game assets...";
          const JSZipLib = await ensureJSZipLoaded();
          const zip = await JSZipLib.loadAsync(zipBlob);
          const files = Object.values(zip.files).filter(f => !f.dir);
          const total = files.length;
          const cache = await caches.open(CACHE_NAME);

          let processed = 0;
          const batchSize = 48;

          for (let i = 0; i < files.length; i += batchSize) {
            const batch = files.slice(i, i + batchSize);
            await Promise.all(batch.map(async (file) => {
              try {
                const u8 = await file.async("uint8array");
                await cache.put(file.name, new Response(u8, { headers: { 'Content-Type': 'application/octet-stream' } }));
                var baseName = file.name.split("/").pop();
                if (baseName && baseName !== file.name) {
                  await cache.put(baseName, new Response(u8, { headers: { 'Content-Type': 'application/octet-stream' } }));
                }
              } catch(e) {
                console.error("Cache put error:", file.name, e);
              }
              processed++;
              if (pctEl) pctEl.textContent = Math.round((processed / total) * 100) + "%";
              if (fillEl) fillEl.style.width = Math.round((processed / total) * 100) + "%";
              if (statusEl) statusEl.textContent = "Extracting assets (" + processed + "/" + total + ")...";
            }));
            await new Promise(r => setTimeout(r, 0));
          }

          await cache.put("CACHE_COMPLETE", new Response("ok"));
        }

        function getParts(prefix, start, end) {
          const parts = [];
          for (let i = start; i <= end; i++) {
            parts.push(prefix + ".part" + i);
          }
          return parts;
        }

        // Background pre-fetch and pre-cache engine components directly into CacheStorage
        async function prefetchEngineComponents() {
          const engineFiles = [
            "Build/w-pt.loader.js",
            "Build/w-pt.data.unityweb",
            "Build/w-pt.framework.js.unityweb",
            "Build/w-pt.wasm.unityweb"
          ];
          try {
            const cache = await caches.open(CACHE_NAME);
            await Promise.all(engineFiles.map(async (f) => {
              const baseName = f.split("/").pop();
              const existing = await cache.match(f);
              if (!existing) {
                for (let i = 0; i < CDN_BASES.length; i++) {
                  try {
                    const res = await originalFetch(CDN_BASES[i] + f);
                    if (res.ok) {
                      const clone = res.clone();
                      await cache.put(f, res);
                      if (baseName && baseName !== f) {
                        await cache.put(baseName, clone);
                      }
                      break;
                    }
                  } catch(e) {}
                }
              }
            }));
          } catch(e) {}
        }

        async function downloadPartsConcurrently(parts, totalExpectedBytes, concurrency = 32) {
          let loadedBytes = 0;
          const results = new Array(parts.length);
          let nextIndex = 0;
          const startTime = performance.now();

          function onBytes(n) {
            loadedBytes += n;
            const elapsed = (performance.now() - startTime) / 1000;
            const speedMBps = elapsed > 0 ? ((loadedBytes / (1024 * 1024)) / elapsed).toFixed(1) : "0";
            updateProgress(
              loadedBytes, 
              totalExpectedBytes, 
              "Ultra-Speed Downloading (" + Math.round((loadedBytes / totalExpectedBytes) * 100) + "% @ " + speedMBps + " MB/s)..."
            );
          }

          async function worker() {
            while (nextIndex < parts.length) {
              const idx = nextIndex++;
              results[idx] = await fetchPartWithRetry(parts[idx], idx, onBytes);
            }
          }

          const workers = [];
          for (let i = 0; i < Math.min(concurrency, parts.length); i++) {
            workers.push(worker());
          }
          await Promise.all(workers);
          return new Blob(results, { type: "application/zip" });
        }

        (async () => {
          try {
            // Kick off engine pre-caching in parallel with asset pipeline
            const enginePrefetchPromise = prefetchEngineComponents();
            await cleanupOldCaches();
            const cached = await isCached();
            if (!cached) {
              const TOTAL_EXPECTED = 2083200000;
              const parts = getParts("StreamingAssets/aa/WebGL.zip", 1, 100);
              const zipBlob = await downloadPartsConcurrently(parts, TOTAL_EXPECTED, 32);
              await unzipAndStore(zipBlob);
            } else {
              if (statusEl) statusEl.textContent = "Instant Cache Ready!";
              if (fillEl) fillEl.style.width = "100%";
              if (pctEl) pctEl.textContent = "100%";
            }

            await enginePrefetchPromise;

            if (statusEl) statusEl.textContent = "Booting WebGL Engine...";

            const canvas = document.querySelector("#unity-canvas");

            const config = {
              dataUrl: "Build/w-pt.data.unityweb",
              frameworkUrl: "Build/w-pt.framework.js.unityweb",
              codeUrl: "Build/w-pt.wasm.unityweb",
              streamingAssetsUrl: "StreamingAssets",
              companyName: "Team Cherry",
              productName: "Hollow Knight Silksong",
              productVersion: "1.0",
            };

            const loaderScript = document.createElement("script");
            loaderScript.src = "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/Build/w-pt.loader.js";
            loaderScript.onload = () => {
              if (typeof createUnityInstance === "function") {
                createUnityInstance(canvas, config, (progress) => {
                  if (fillEl) fillEl.style.width = (progress * 100) + "%";
                  if (pctEl) pctEl.textContent = Math.round(progress * 100) + "%";
                  if (statusEl) statusEl.textContent = "Initializing Game Modules (" + Math.round(progress * 100) + "%)...";
                }).then(() => {
                  if (modal) modal.style.display = "none";
                }).catch((e) => {
                  if (statusEl) statusEl.textContent = "Launch Error: " + (e?.message || e);
                });
              }
            };
            document.body.appendChild(loaderScript);
          } catch(err) {
            console.error(err);
            if (statusEl) statusEl.textContent = "Error: " + (err?.message || err);
          }
        })();
      })();
    </script>
  </body>
</html>

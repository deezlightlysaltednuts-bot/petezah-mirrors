  <script>
    // Universal iPad Touch Swipe Controller & Audio Unlocker
    (function() {
      var touchStartX = 0;
      var touchStartY = 0;
      var touchStartTime = 0;

      function dispatchKey(code, key, keyCode) {
        var targets = [window, document];
        var canvas = document.querySelector('canvas');
        if (canvas) targets.push(canvas);

        var down = new KeyboardEvent('keydown', {
          code: code,
          key: key,
          bubbles: true,
          cancelable: true,
          composed: true
        });
        Object.defineProperty(down, 'keyCode', { get: function() { return keyCode; } });
        Object.defineProperty(down, 'which', { get: function() { return keyCode; } });

        var up = new KeyboardEvent('keyup', {
          code: code,
          key: key,
          bubbles: true,
          cancelable: true,
          composed: true
        });
        Object.defineProperty(up, 'keyCode', { get: function() { return keyCode; } });
        Object.defineProperty(up, 'which', { get: function() { return keyCode; } });

        targets.forEach(function(t) {
          try { t.dispatchEvent(down); } catch(e) {}
        });

        setTimeout(function() {
          targets.forEach(function(t) {
            try { t.dispatchEvent(up); } catch(e) {}
          });
        }, 90);

        if (navigator.vibrate) {
          try { navigator.vibrate(10); } catch(e) {}
        }
      }

      window.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }
        // Unlock iOS Safari Web Audio
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') ctx.resume();
          }
        } catch(e) {}
      }, { passive: true });

      window.addEventListener('touchend', function(e) {
        if (e.changedTouches && e.changedTouches.length > 0) {
          var dx = e.changedTouches[0].clientX - touchStartX;
          var dy = e.changedTouches[0].clientY - touchStartY;
          var dt = Date.now() - touchStartTime;
          var absDx = Math.abs(dx);
          var absDy = Math.abs(dy);

          if (Math.max(absDx, absDy) > 25 && dt < 800) {
            if (absDx > absDy) {
              if (dx > 0) dispatchKey('ArrowRight', 'ArrowRight', 39);
              else dispatchKey('ArrowLeft', 'ArrowLeft', 37);
            } else {
              if (dy > 0) dispatchKey('ArrowDown', 'ArrowDown', 40);
              else dispatchKey('ArrowUp', 'ArrowUp', 38);
            }
          } else if (Math.max(absDx, absDy) <= 15 && dt < 300) {
            // Tap to jump or start
            dispatchKey('Space', ' ', 32);
          }
        }
      }, { passive: true });

      // Prevent Safari page bounce and gesture zooms
      document.addEventListener('touchmove', function(e) {
        if (e.cancelable) e.preventDefault();
      }, { passive: false });
    })();
  </script>

  <script>
        window.config = {
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25),
            loader: "unity",
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,

            cachedDecompressedFileSizes: {

                "SanFrancisco.asm.memory.unityweb": 951447,
                "SanFrancisco.data.unityweb": 18323917,
                "SanFrancisco.wasm.code.unityweb": 7279617,
                "SanFrancisco.wasm.framework.unityweb": 90693,
            },
        }; 
        window.mergedBlobUrls = {};
        window.assetsReady = false;

        async function mergeSplitFile(fileUrlBase, numParts = 2) {
            const partUrls = Array.from({ length: numParts }, (_, i) => 
                `${fileUrlBase}.part${i + 1}`
            );

            try {
                const responses = await Promise.all(
                    partUrls.map(url => fetch(url))
                );

                if (responses.some(r => !r.ok)) {
                    return null;
                }

                const parts = await Promise.all(
                    responses.map(r => r.arrayBuffer())
                );

                const combinedBlob = new Blob(parts, {
                    type: 'application/octet-stream'
                });

                return URL.createObjectURL(combinedBlob);
            } catch (error) {
                return null;
            }
        }

        function setupXHRInterceptor() {
            if (window.xhrInterceptorInstalled) {
                return;
            }
            
            const originalOpen = XMLHttpRequest.prototype.open;
            const originalSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                this._url = url;
                this._method = method;
                this._args = args;
                
                let finalUrl = url;
                for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
                    if (url.includes(filename)) {
                        finalUrl = blobUrl;
                        break;
                    }
                }
                
                return originalOpen.call(this, method, finalUrl, ...args);
            };

            XMLHttpRequest.prototype.send = function(...args) {
                const xhr = this;
                
                if (!window.assetsReady) {
                    const checkReady = setInterval(() => { 
                        if (window.assetsReady) {
                            clearInterval(checkReady);
                            originalSend.apply(xhr, args);
                        }
                    }, 50);
                    return;
                }
                
                return originalSend.apply(this, args);
            };
            
            window.xhrInterceptorInstalled = true;
        }

        async function prepareGameAssets() {
            try {
                window.assetsReady = false;
                delete window.xhrInterceptorInstalled;
                window.mergedBlobUrls = {};
                
                setupXHRInterceptor();
                
                const filesToMerge = [
                    'SanFrancisco.data.unityweb',
                    'SanFrancisco.wasm.code.unityweb'
                ];
                 
                for (const filename of filesToMerge) {
                    const blobUrl = await mergeSplitFile(filename, 2);
                    if (blobUrl) {
                        window.mergedBlobUrls[filename] = blobUrl;
                    } 
                }
                
                window.assetsPrepared = true;
                window.assetsReady = true;
                
            } catch (error) {
                window.assetsPrepared = false;
                window.assetsReady = true;
            }
        }

        prepareGameAssets();

    </script>
